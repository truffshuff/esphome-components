# Example: NimBLE Improv WiFi Provisioning Only
# This example shows how to use nimble_improv WITHOUT nimble_proxy
# Users can provision WiFi credentials via BLE using the Improv protocol

esphome:
  name: improv-only
  friendly_name: "Improv Only Device"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# NimBLE Base - Required for all NimBLE components
nimble_base:

# WiFi configuration (can be changed via BLE Improv)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot in case wifi connection fails
  ap:
    ssid: "Improv-Only Fallback"
    password: "12345678"

# Improv WiFi Provisioning via BLE
nimble_improv:
  authorizer: none
  identify_duration: 10s
  wifi_timeout: 1min

# Optional: Status LED to show provisioning state
output:
  - platform: gpio
    id: status_led
    pin: GPIO2

# Note: No nimble_proxy or api component needed!
# This device only uses BLE for WiFi provisioning
