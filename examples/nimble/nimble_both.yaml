# Example: Both NimBLE Improv and Proxy
# This example shows how to use BOTH nimble_improv and nimble_proxy together
# Device supports WiFi provisioning via BLE AND acts as a BLE proxy for Home Assistant

esphome:
  name: nimble-full
  friendly_name: "Full NimBLE Device"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# NimBLE Base - Required for all NimBLE components
nimble_base:

# WiFi configuration (can be changed via BLE Improv)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot
  ap:
    ssid: "NimBLE-Full Fallback"
    password: "12345678"

# API for Home Assistant connection (required for proxy)
api:
  encryption:
    key: !secret api_encryption_key

# OTA updates
ota:
  - platform: esphome
    password: !secret ota_password

# BLE Proxy for Home Assistant
nimble_proxy:
  active: true
  max_connections: 3

# Improv WiFi Provisioning via BLE
nimble_improv:
  authorizer: none
  identify_duration: 10s
  wifi_timeout: 1min

# Optional: Status LED to show provisioning state
output:
  - platform: gpio
    id: status_led
    pin: GPIO2

# This device has BOTH capabilities:
# 1. WiFi provisioning via BLE (Improv protocol)
# 2. BLE proxy for Home Assistant to scan for BLE devices
