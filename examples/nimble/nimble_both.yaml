# NimBLE Bluetooth proxy + Improv provisioning + on-device BLE sensors.

esphome:
  name: nimble-full
  min_version: 2026.9.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal   # match your module (quad on N8R2, octal on N8R8/N16R8)
  speed: 80MHz

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

external_components:
  - source: github://truffshuff/esphome-components
    components:
      - nimble_base
      - nimble_tracker
      - ble_device_base
      - bluetooth_connection
      - bluetooth_proxy
      - nimble_improv

nimble_base:
  use_psram: true

nimble_tracker:
  id: ble_tracker
  scan_parameters:
    interval: 320ms
    window: 60ms
    active: true

bluetooth_proxy:
  active: true
  connection_slots: 2

nimble_improv:

# Upstream sensors that bind through ble_device_base work on nimble_tracker.
sensor:
  - platform: ble_rssi
    mac_address: AA:BB:CC:DD:EE:FF
    name: "Tag RSSI"

binary_sensor:
  - platform: ble_presence
    mac_address: AA:BB:CC:DD:EE:FF
    name: "Tag present"

# Pause/resume scanning (e.g. around OTA or large HTTP transfers).
switch:
  - platform: template
    name: "BLE Scanner"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - nimble_tracker.start_scan:
          id: ble_tracker
          continuous: true
    on_turn_off:
      - nimble_tracker.stop_scan: ble_tracker
