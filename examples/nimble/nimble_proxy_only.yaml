# NimBLE Bluetooth proxy for Home Assistant.
#
# ESPHome 2026.9.0's own bluetooth_proxy (vendored in this repository) on a
# NimBLE scanner and GATT backend: same behaviour for Home Assistant as a
# Bluedroid proxy, smaller flash and internal-RAM footprint.

esphome:
  name: nimble-proxy
  min_version: 2026.9.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

external_components:
  - source: github://truffshuff/esphome-components
    components:
      - nimble_base
      - nimble_tracker
      - ble_device_base       # vendored, NimBLE patch set
      - bluetooth_connection  # vendored, plus the NimBLE GATT backend
      - bluetooth_proxy       # vendored, NimBLE patch set

nimble_base:

nimble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true
  connection_slots: 3
