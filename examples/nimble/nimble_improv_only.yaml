# Improv WiFi provisioning over NimBLE (esp32_improv equivalent).
#
# The Improv service runs while WiFi needs provisioning (no stored network, or
# no connection for wifi_timeout) and stops once the device is provisioned.

esphome:
  name: nimble-improv
  min_version: 2026.9.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

# No network: the device waits for Improv provisioning. ESPHome's wifi schema
# only accepts a network-less config for improv_ble / improv_serial, so a
# fallback hotspot is declared (it is also a second way in).
wifi:
  ap:
    ssid: "nimble-improv setup"

external_components:
  - source: github://truffshuff/esphome-components
    components: [nimble_base, nimble_improv]

nimble_base:

binary_sensor:
  - platform: gpio
    id: provision_button
    pin:
      number: GPIO0
      inverted: true

output:
  - platform: gpio
    id: status_led
    pin: GPIO2

nimble_improv:
  authorizer: provision_button      # press the button to accept settings
  authorized_duration: 1min
  status_indicator: status_led      # blinks per Improv state, enables Identify
  next_url: "http://{{ip_address}}/"
